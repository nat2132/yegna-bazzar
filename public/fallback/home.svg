<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Hand-thrown clay pots and sini cups">
  <rect width="800" height="600" fill="#f6efe1"/>
  <ellipse cx="400" cy="496" rx="260" ry="26" fill="#ede2cb"/>
  <!-- large pot -->
  <g fill="#52372a">
    <circle cx="300" cy="380" r="110"/>
    <path d="M266 250 h68 q18 24 0 46 h-68 q-18 -22 0 -46 z"/>
    <rect x="288" y="196" width="22" height="30" rx="11"/>
  </g>
  <rect x="262" y="300" width="76" height="14" fill="#c98a2b"/>
  <path d="M196 372 q-38 8 -30 48 q8 40 46 36" fill="none" stroke="#52372a" stroke-width="24" stroke-linecap="round"/>
  <!-- small pot -->
  <g fill="#2e1d13">
    <circle cx="470" cy="410" r="66"/>
    <path d="M448 330 h44 q14 18 0 36 h-44 q-14 -18 0 -36 z"/>
    <rect x="460" y="296" width="18" height="24" rx="9"/>
  </g>
  <!-- sini cups -->
  <path d="M580 428 l84 0 l-14 48 l-56 0 z" fill="#4e6b3a"/>
  <path d="M596 376 h52 l-4 36 h-44 z" fill="#4e6b3a"/>
  <!-- tibeb border -->
  <g>
    <rect x="0" y="540" width="800" height="60" fill="#f6efe1"/>
    <rect x="0" y="540" width="800" height="10" fill="#241610"/>
    <g fill="#a8431f">
      <rect x="30" y="558" width="90" height="30" rx="6"/>
      <rect x="230" y="558" width="90" height="30" rx="6"/>
      <rect x="430" y="558" width="90" height="30" rx="6"/>
      <rect x="630" y="558" width="90" height="30" rx="6"/>
    </g>
    <g fill="#8f5f16">
      <rect x="130" y="558" width="90" height="30" rx="6"/>
      <rect x="330" y="558" width="90" height="30" rx="6"/>
      <rect x="530" y="558" width="90" height="30" rx="6"/>
      <rect x="730" y="558" width="60" height="30" rx="6"/>
    </g>
  </g>
</svg>
